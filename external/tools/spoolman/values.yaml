service:
  main:
    type: ClusterIP
    primary: true
    ports:
      http:
        enabled: true
        port: 8000
        primary: true
    controller: main
route:
  main:
    parentRefs:
    - name: main
      kind: Gateway
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
    enabled: true
    kind: HTTPRoute
    hostnames:
    - spoolman.mattgerega.net
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - weight: 1
        port: 8000
        kind: Service
        name: spoolman
        group: ""
controllers:
  main:
    replicas: 1
    revisionHistoryLimit: 3
    type: deployment
    enabled: true
    strategy: Recreate
    containers:
      main:
        env:
          TZ: America/New_York
        strategy:
          type: Recreate
        image:
          repository: ghcr.io/donkie/spoolman
          tag: 0.27.1
          pullPolicy: IfNotPresent
        probes:
          liveness:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 3
              periodSeconds: 10
              initialDelaySeconds: 0
              timeoutSeconds: 1
            custom: false
          readiness:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 3
              periodSeconds: 10
              initialDelaySeconds: 0
              timeoutSeconds: 1
            custom: false
          startup:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 30
              periodSeconds: 5
              initialDelaySeconds: 0
              timeoutSeconds: 1
            custom: false
        resources:
          requests:
            cpu: 5m
persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    globalMounts:
    - path: /home/app/.local/share/spoolman
      readOnly: false
    accessMode: ReadWriteMany
    size: 2Gi
    storageClass: nfs-client

