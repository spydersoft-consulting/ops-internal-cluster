service:
  main:
    primary: true
    controller: main
    type: ClusterIP
    ports:
      http:
        enabled: false
      metrics:
        primary: true
        protocol: TCP
        enabled: true
        port: 9130
    annotations:
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/path: /metrics
controllers:
  main:
    enabled: true
    containers:
      main:
        env:
          UP_UNIFI_DEFAULT_URL: https://unifi
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
        image:
          pullPolicy: IfNotPresent
          tag: v5.9.4
          repository: ghcr.io/unpoller/unpoller
        envFrom:
        - secretRef:
            name: unifi-poller
        resources:
          requests:
            cpu: 10m
        probes:
          readiness:
            custom: false
            spec:
              failureThreshold: 3
              timeoutSeconds: 1
              initialDelaySeconds: 0
              periodSeconds: 10
            type: TCP
            enabled: true
          liveness:
            custom: false
            spec:
              failureThreshold: 3
              timeoutSeconds: 1
              initialDelaySeconds: 0
              periodSeconds: 10
            type: TCP
            enabled: true
          startup:
            custom: false
            spec:
              failureThreshold: 30
              timeoutSeconds: 1
              initialDelaySeconds: 0
              periodSeconds: 5
            type: TCP
            enabled: true
    strategy: Recreate
    type: deployment
    revisionHistoryLimit: 3
    replicas: 1
serviceMonitor:
  main:
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    endpoints:
    - path: /metrics
      scheme: http
      interval: 1m
      scrapeTimeout: 30s
      port: metrics
    enabled: false
ingress:
  main:
    enabled: false
influxdb:
  authEnabled: false
  enabled: false
  architecture: standalone
  database: unifi
  persistence:
    enabled: false

