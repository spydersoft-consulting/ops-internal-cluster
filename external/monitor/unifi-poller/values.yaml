influxdb:
  database: unifi
  enabled: false
  persistence:
    enabled: false
  architecture: standalone
  authEnabled: false
serviceMonitor:
  main:
    enabled: false
    endpoints:
    - port: metrics
      path: /metrics
      interval: 1m
      scrapeTimeout: 30s
      scheme: http
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
controllers:
  main:
    type: deployment
    strategy: Recreate
    enabled: true
    revisionHistoryLimit: 3
    containers:
      main:
        envFrom:
        - secretRef:
            name: unifi-poller
        probes:
          liveness:
            custom: false
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              failureThreshold: 3
            enabled: true
          startup:
            custom: false
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 5
              failureThreshold: 30
            enabled: true
          readiness:
            custom: false
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              failureThreshold: 3
            enabled: true
        image:
          repository: ghcr.io/unpoller/unpoller
          tag: v5.2.8
          pullPolicy: IfNotPresent
        env:
          UP_UNIFI_DEFAULT_URL: https://unifi
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
        resources:
          requests:
            cpu: 10m
    replicas: 1
ingress:
  main:
    enabled: false
service:
  main:
    ports:
      metrics:
        enabled: true
        primary: true
        port: 9130
        protocol: TCP
      http:
        enabled: false
    type: ClusterIP
    primary: true
    annotations:
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/path: /metrics
    controller: main

