controllers:
  main:
    revisionHistoryLimit: 3
    enabled: true
    strategy: Recreate
    type: deployment
    containers:
      main:
        envFrom:
        - secretRef:
            name: unifi-poller
        resources:
          requests:
            cpu: 10m
        probes:
          readiness:
            spec:
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
            custom: false
            type: TCP
            enabled: true
          startup:
            spec:
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 30
            custom: false
            type: TCP
            enabled: true
          liveness:
            spec:
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
            custom: false
            type: TCP
            enabled: true
        env:
          UP_UNIFI_DEFAULT_URL: https://unifi
          TZ: America/New_York
          UP_INFLUXDB_DISABLE: true
        image:
          repository: ghcr.io/unpoller/unpoller
          pullPolicy: IfNotPresent
          tag: v5.2.1
    replicas: 1
ingress:
  main:
    enabled: false
serviceMonitor:
  main:
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    enabled: false
    endpoints:
    - port: metrics
      scheme: http
      interval: 1m
      scrapeTimeout: 30s
      path: /metrics
influxdb:
  enabled: false
  authEnabled: false
  database: unifi
  architecture: standalone
  persistence:
    enabled: false
service:
  main:
    annotations:
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/path: /metrics
    type: ClusterIP
    primary: true
    ports:
      http:
        enabled: false
      metrics:
        primary: true
        protocol: TCP
        enabled: true
        port: 9130
    controller: main

