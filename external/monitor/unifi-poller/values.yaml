ingress:
  main:
    enabled: false
controllers:
  main:
    enabled: true
    revisionHistoryLimit: 3
    strategy: Recreate
    type: deployment
    replicas: 1
    containers:
      main:
        probes:
          startup:
            enabled: true
            custom: false
            type: TCP
            spec:
              timeoutSeconds: 1
              initialDelaySeconds: 0
              failureThreshold: 30
              periodSeconds: 5
          readiness:
            enabled: true
            custom: false
            type: TCP
            spec:
              timeoutSeconds: 1
              initialDelaySeconds: 0
              failureThreshold: 3
              periodSeconds: 10
          liveness:
            enabled: true
            custom: false
            type: TCP
            spec:
              timeoutSeconds: 1
              initialDelaySeconds: 0
              failureThreshold: 3
              periodSeconds: 10
        envFrom:
        - secretRef:
            name: unifi-poller
        image:
          tag: v4.0.0
          pullPolicy: IfNotPresent
          repository: ghcr.io/unpoller/unpoller
        env:
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
          UP_INFLUXDB_DISABLE: true
        resources:
          requests:
            cpu: 10m
serviceMonitor:
  main:
    enabled: false
    endpoints:
    - scrapeTimeout: 30s
      path: /metrics
      port: metrics
      interval: 1m
      scheme: http
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
service:
  main:
    controller: main
    type: ClusterIP
    primary: true
    ports:
      http:
        enabled: false
      metrics:
        enabled: true
        primary: true
        protocol: TCP
        port: 9130
    annotations:
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/path: /metrics
influxdb:
  architecture: standalone
  persistence:
    enabled: false
  enabled: false
  authEnabled: false
  database: unifi

