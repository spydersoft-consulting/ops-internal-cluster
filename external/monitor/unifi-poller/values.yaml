service:
  main:
    ports:
      metrics:
        protocol: TCP
        enabled: true
        primary: true
        port: 9130
      http:
        enabled: false
    type: ClusterIP
    annotations:
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/scrape: "true"
    controller: main
    primary: true
ingress:
  main:
    enabled: false
controllers:
  main:
    revisionHistoryLimit: 3
    containers:
      main:
        resources:
          requests:
            cpu: 10m
        image:
          pullPolicy: IfNotPresent
          tag: v3.5.0
          repository: ghcr.io/unpoller/unpoller
        env:
          TZ: America/New_York
          UP_INFLUXDB_DISABLE: true
          UP_UNIFI_DEFAULT_URL: https://unifi
        probes:
          liveness:
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              failureThreshold: 3
            type: TCP
            enabled: true
            custom: false
          startup:
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 5
              failureThreshold: 30
            type: TCP
            enabled: true
            custom: false
          readiness:
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              failureThreshold: 3
            type: TCP
            enabled: true
            custom: false
        envFrom:
        - secretRef:
            name: unifi-poller
    type: deployment
    strategy: Recreate
    replicas: 1
    enabled: true
influxdb:
  authEnabled: false
  architecture: standalone
  enabled: false
  database: unifi
  persistence:
    enabled: false
serviceMonitor:
  main:
    enabled: false
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    endpoints:
    - scrapeTimeout: 30s
      interval: 1m
      scheme: http
      path: /metrics
      port: metrics

