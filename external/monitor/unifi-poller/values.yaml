serviceMonitor:
  main:
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    enabled: false
    endpoints:
    - scheme: http
      port: metrics
      interval: 1m
      path: /metrics
      scrapeTimeout: 30s
ingress:
  main:
    enabled: false
influxdb:
  authEnabled: false
  architecture: standalone
  enabled: false
  persistence:
    enabled: false
  database: unifi
service:
  main:
    ports:
      http:
        enabled: false
      metrics:
        primary: true
        enabled: true
        protocol: TCP
        port: 9130
    controller: main
    primary: true
    annotations:
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scrape: "true"
    type: ClusterIP
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/unpoller/unpoller
          pullPolicy: IfNotPresent
          tag: v5.4.0
        resources:
          requests:
            cpu: 10m
        env:
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
          UP_INFLUXDB_DISABLE: true
        probes:
          readiness:
            spec:
              initialDelaySeconds: 0
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 1
            custom: false
            type: TCP
            enabled: true
          startup:
            spec:
              initialDelaySeconds: 0
              failureThreshold: 30
              periodSeconds: 5
              timeoutSeconds: 1
            custom: false
            type: TCP
            enabled: true
          liveness:
            spec:
              initialDelaySeconds: 0
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 1
            custom: false
            type: TCP
            enabled: true
        envFrom:
        - secretRef:
            name: unifi-poller
    revisionHistoryLimit: 3
    enabled: true
    replicas: 1
    strategy: Recreate
    type: deployment

