serviceMonitor:
  main:
    enabled: false
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    endpoints:
    - path: /metrics
      scheme: http
      interval: 1m
      port: metrics
      scrapeTimeout: 30s
influxdb:
  enabled: false
  database: unifi
  architecture: standalone
  persistence:
    enabled: false
  authEnabled: false
service:
  main:
    ports:
      http:
        enabled: false
      metrics:
        port: 9130
        protocol: TCP
        enabled: true
        primary: true
    type: ClusterIP
    annotations:
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scheme: http
    controller: main
    primary: true
controllers:
  main:
    enabled: true
    type: deployment
    containers:
      main:
        envFrom:
        - secretRef:
            name: unifi-poller
        resources:
          requests:
            cpu: 10m
        env:
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
          UP_INFLUXDB_DISABLE: true
        image:
          pullPolicy: IfNotPresent
          repository: ghcr.io/unpoller/unpoller
          tag: v5.6.3
        probes:
          readiness:
            custom: false
            enabled: true
            type: TCP
            spec:
              periodSeconds: 10
              failureThreshold: 3
              timeoutSeconds: 1
              initialDelaySeconds: 0
          liveness:
            custom: false
            enabled: true
            type: TCP
            spec:
              periodSeconds: 10
              failureThreshold: 3
              timeoutSeconds: 1
              initialDelaySeconds: 0
          startup:
            custom: false
            enabled: true
            type: TCP
            spec:
              periodSeconds: 5
              failureThreshold: 30
              timeoutSeconds: 1
              initialDelaySeconds: 0
    revisionHistoryLimit: 3
    replicas: 1
    strategy: Recreate
ingress:
  main:
    enabled: false

