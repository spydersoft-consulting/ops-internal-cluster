ingress:
  main:
    enabled: false
controllers:
  main:
    type: deployment
    strategy: Recreate
    revisionHistoryLimit: 3
    containers:
      main:
        env:
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
          UP_INFLUXDB_DISABLE: true
        resources:
          requests:
            cpu: 10m
        probes:
          readiness:
            custom: false
            enabled: true
            type: TCP
            spec:
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 1
              initialDelaySeconds: 0
          startup:
            custom: false
            enabled: true
            type: TCP
            spec:
              failureThreshold: 30
              periodSeconds: 5
              timeoutSeconds: 1
              initialDelaySeconds: 0
          liveness:
            custom: false
            enabled: true
            type: TCP
            spec:
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 1
              initialDelaySeconds: 0
        envFrom:
        - secretRef:
            name: unifi-poller
        image:
          repository: ghcr.io/unpoller/unpoller
          pullPolicy: IfNotPresent
          tag: v5.5.0
    replicas: 1
    enabled: true
serviceMonitor:
  main:
    endpoints:
    - scrapeTimeout: 30s
      path: /metrics
      port: metrics
      interval: 1m
      scheme: http
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    enabled: false
influxdb:
  database: unifi
  architecture: standalone
  persistence:
    enabled: false
  authEnabled: false
  enabled: false
service:
  main:
    controller: main
    annotations:
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/port: "9130"
    ports:
      http:
        enabled: false
      metrics:
        port: 9130
        protocol: TCP
        enabled: true
        primary: true
    primary: true
    type: ClusterIP

