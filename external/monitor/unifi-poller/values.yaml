controllers:
  main:
    replicas: 1
    strategy: Recreate
    containers:
      main:
        probes:
          startup:
            custom: false
            type: TCP
            enabled: true
            spec:
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 30
          liveness:
            custom: false
            type: TCP
            enabled: true
            spec:
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness:
            custom: false
            type: TCP
            enabled: true
            spec:
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
        resources:
          requests:
            cpu: 10m
        env:
          UP_UNIFI_DEFAULT_URL: https://unifi
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
        image:
          repository: ghcr.io/unpoller/unpoller
          pullPolicy: IfNotPresent
          tag: v4.0.1
        envFrom:
        - secretRef:
            name: unifi-poller
    enabled: true
    type: deployment
    revisionHistoryLimit: 3
ingress:
  main:
    enabled: false
influxdb:
  authEnabled: false
  persistence:
    enabled: false
  database: unifi
  enabled: false
  architecture: standalone
serviceMonitor:
  main:
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    endpoints:
    - scheme: http
      scrapeTimeout: 30s
      port: metrics
      interval: 1m
      path: /metrics
    enabled: false
service:
  main:
    controller: main
    annotations:
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/port: "9130"
    ports:
      metrics:
        port: 9130
        enabled: true
        primary: true
        protocol: TCP
      http:
        enabled: false
    primary: true
    type: ClusterIP

