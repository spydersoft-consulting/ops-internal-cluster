service:
  main:
    type: ClusterIP
    ports:
      metrics:
        enabled: true
        primary: true
        port: 9130
        protocol: TCP
      http:
        enabled: false
    controller: main
    primary: true
    annotations:
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/port: "9130"
serviceMonitor:
  main:
    enabled: false
    endpoints:
    - port: metrics
      interval: 1m
      path: /metrics
      scheme: http
      scrapeTimeout: 30s
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
controllers:
  main:
    strategy: Recreate
    revisionHistoryLimit: 3
    replicas: 1
    enabled: true
    type: deployment
    containers:
      main:
        probes:
          liveness:
            enabled: true
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              failureThreshold: 3
            custom: false
          startup:
            enabled: true
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 5
              failureThreshold: 30
            custom: false
          readiness:
            enabled: true
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              failureThreshold: 3
            custom: false
        env:
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
        resources:
          requests:
            cpu: 10m
        image:
          tag: v5.10.1
          repository: ghcr.io/unpoller/unpoller
          pullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: unifi-poller
ingress:
  main:
    enabled: false
influxdb:
  database: unifi
  authEnabled: false
  architecture: standalone
  enabled: false
  persistence:
    enabled: false

