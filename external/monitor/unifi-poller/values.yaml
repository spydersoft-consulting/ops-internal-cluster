serviceMonitor:
  main:
    endpoints:
    - interval: 1m
      scheme: http
      scrapeTimeout: 30s
      path: /metrics
      port: metrics
    enabled: false
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
ingress:
  main:
    enabled: false
service:
  main:
    annotations:
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/port: "9130"
    controller: main
    type: ClusterIP
    primary: true
    ports:
      metrics:
        protocol: TCP
        primary: true
        enabled: true
        port: 9130
      http:
        enabled: false
influxdb:
  database: unifi
  authEnabled: false
  persistence:
    enabled: false
  enabled: false
  architecture: standalone
controllers:
  main:
    revisionHistoryLimit: 3
    type: deployment
    containers:
      main:
        resources:
          requests:
            cpu: 10m
        env:
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
        image:
          pullPolicy: IfNotPresent
          tag: v5.7.0
          repository: ghcr.io/unpoller/unpoller
        probes:
          readiness:
            spec:
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 1
              initialDelaySeconds: 0
            type: TCP
            enabled: true
            custom: false
          startup:
            spec:
              failureThreshold: 30
              periodSeconds: 5
              timeoutSeconds: 1
              initialDelaySeconds: 0
            type: TCP
            enabled: true
            custom: false
          liveness:
            spec:
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 1
              initialDelaySeconds: 0
            type: TCP
            enabled: true
            custom: false
        envFrom:
        - secretRef:
            name: unifi-poller
    enabled: true
    replicas: 1
    strategy: Recreate

