serviceMonitor:
  main:
    enabled: false
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    endpoints:
    - scheme: http
      scrapeTimeout: 30s
      path: /metrics
      port: metrics
      interval: 1m
influxdb:
  architecture: standalone
  enabled: false
  persistence:
    enabled: false
  authEnabled: false
  database: unifi
service:
  main:
    controller: main
    annotations:
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scheme: http
    ports:
      http:
        enabled: false
      metrics:
        port: 9130
        protocol: TCP
        primary: true
        enabled: true
    type: ClusterIP
    primary: true
controllers:
  main:
    containers:
      main:
        env:
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
        envFrom:
        - secretRef:
            name: unifi-poller
        resources:
          requests:
            cpu: 10m
        image:
          tag: v5.2.2
          pullPolicy: IfNotPresent
          repository: ghcr.io/unpoller/unpoller
        probes:
          startup:
            custom: false
            spec:
              failureThreshold: 30
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 1
            enabled: true
            type: TCP
          liveness:
            custom: false
            spec:
              failureThreshold: 3
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
            enabled: true
            type: TCP
          readiness:
            custom: false
            spec:
              failureThreshold: 3
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
            enabled: true
            type: TCP
    enabled: true
    replicas: 1
    revisionHistoryLimit: 3
    strategy: Recreate
    type: deployment
ingress:
  main:
    enabled: false

