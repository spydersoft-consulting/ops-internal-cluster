serviceMonitor:
  main:
    enabled: false
    endpoints:
    - scheme: http
      port: metrics
      scrapeTimeout: 30s
      path: /metrics
      interval: 1m
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
service:
  main:
    ports:
      metrics:
        enabled: true
        port: 9130
        primary: true
        protocol: TCP
      http:
        enabled: false
    controller: main
    type: ClusterIP
    primary: true
    annotations:
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scheme: http
influxdb:
  persistence:
    enabled: false
  enabled: false
  database: unifi
  architecture: standalone
  authEnabled: false
controllers:
  main:
    replicas: 1
    revisionHistoryLimit: 3
    type: deployment
    enabled: true
    strategy: Recreate
    containers:
      main:
        envFrom:
        - secretRef:
            name: unifi-poller
        env:
          UP_INFLUXDB_DISABLE: true
          UP_UNIFI_DEFAULT_URL: https://unifi
          TZ: America/New_York
        image:
          repository: ghcr.io/unpoller/unpoller
          tag: v5.9.2
          pullPolicy: IfNotPresent
        probes:
          liveness:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 3
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
            custom: false
          readiness:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 3
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
            custom: false
          startup:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 30
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 5
            custom: false
        resources:
          requests:
            cpu: 10m
ingress:
  main:
    enabled: false

