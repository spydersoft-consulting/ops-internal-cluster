serviceMonitor:
  main:
    enabled: false
    endpoints:
    - scheme: http
      path: /metrics
      port: metrics
      scrapeTimeout: 30s
      interval: 1m
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
service:
  main:
    ports:
      metrics:
        enabled: true
        primary: true
        port: 9130
        protocol: TCP
      http:
        enabled: false
    annotations:
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/path: /metrics
    primary: true
    type: ClusterIP
    controller: main
controllers:
  main:
    replicas: 1
    enabled: true
    strategy: Recreate
    containers:
      main:
        env:
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
          UP_INFLUXDB_DISABLE: true
        probes:
          liveness:
            type: TCP
            custom: false
            spec:
              timeoutSeconds: 1
              failureThreshold: 3
              periodSeconds: 10
              initialDelaySeconds: 0
            enabled: true
          startup:
            type: TCP
            custom: false
            spec:
              timeoutSeconds: 1
              failureThreshold: 30
              periodSeconds: 5
              initialDelaySeconds: 0
            enabled: true
          readiness:
            type: TCP
            custom: false
            spec:
              timeoutSeconds: 1
              failureThreshold: 3
              periodSeconds: 10
              initialDelaySeconds: 0
            enabled: true
        envFrom:
        - secretRef:
            name: unifi-poller
        resources:
          requests:
            cpu: 10m
        image:
          pullPolicy: IfNotPresent
          tag: v5.8.2
          repository: ghcr.io/unpoller/unpoller
    type: deployment
    revisionHistoryLimit: 3
ingress:
  main:
    enabled: false
influxdb:
  database: unifi
  architecture: standalone
  enabled: false
  authEnabled: false
  persistence:
    enabled: false

