ingress:
  main:
    enabled: false
service:
  main:
    ports:
      metrics:
        protocol: TCP
        primary: true
        port: 9130
        enabled: true
      http:
        enabled: false
    primary: true
    annotations:
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scheme: http
    controller: main
    type: ClusterIP
influxdb:
  database: unifi
  authEnabled: false
  enabled: false
  architecture: standalone
  persistence:
    enabled: false
controllers:
  main:
    revisionHistoryLimit: 3
    containers:
      main:
        image:
          tag: v5.2.5
          repository: ghcr.io/unpoller/unpoller
          pullPolicy: IfNotPresent
        env:
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
          UP_INFLUXDB_DISABLE: true
        probes:
          startup:
            enabled: true
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              failureThreshold: 30
              periodSeconds: 5
            custom: false
          liveness:
            enabled: true
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              failureThreshold: 3
              periodSeconds: 10
            custom: false
          readiness:
            enabled: true
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              failureThreshold: 3
              periodSeconds: 10
            custom: false
        resources:
          requests:
            cpu: 10m
        envFrom:
        - secretRef:
            name: unifi-poller
    replicas: 1
    enabled: true
    type: deployment
    strategy: Recreate
serviceMonitor:
  main:
    enabled: false
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    endpoints:
    - interval: 1m
      path: /metrics
      port: metrics
      scrapeTimeout: 30s
      scheme: http

