service:
  main:
    controller: main
    annotations:
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/port: "9130"
    type: ClusterIP
    ports:
      metrics:
        enabled: true
        primary: true
        protocol: TCP
        port: 9130
      http:
        enabled: false
    primary: true
serviceMonitor:
  main:
    enabled: false
    endpoints:
    - port: metrics
      interval: 1m
      path: /metrics
      scheme: http
      scrapeTimeout: 30s
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
influxdb:
  enabled: false
  architecture: standalone
  database: unifi
  persistence:
    enabled: false
  authEnabled: false
ingress:
  main:
    enabled: false
controllers:
  main:
    enabled: true
    replicas: 1
    strategy: Recreate
    revisionHistoryLimit: 3
    type: deployment
    containers:
      main:
        resources:
          requests:
            cpu: 10m
        env:
          UP_UNIFI_DEFAULT_URL: https://unifi
          TZ: America/New_York
          UP_INFLUXDB_DISABLE: true
        envFrom:
        - secretRef:
            name: unifi-poller
        image:
          pullPolicy: IfNotPresent
          repository: ghcr.io/unpoller/unpoller
          tag: v5.8.3
        probes:
          readiness:
            custom: false
            type: TCP
            spec:
              failureThreshold: 3
              timeoutSeconds: 1
              periodSeconds: 10
              initialDelaySeconds: 0
            enabled: true
          liveness:
            custom: false
            type: TCP
            spec:
              failureThreshold: 3
              timeoutSeconds: 1
              periodSeconds: 10
              initialDelaySeconds: 0
            enabled: true
          startup:
            custom: false
            type: TCP
            spec:
              failureThreshold: 30
              timeoutSeconds: 1
              periodSeconds: 5
              initialDelaySeconds: 0
            enabled: true

