ingress:
  main:
    enabled: false
controllers:
  main:
    strategy: Recreate
    replicas: 1
    type: deployment
    revisionHistoryLimit: 3
    containers:
      main:
        env:
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
        envFrom:
        - secretRef:
            name: unifi-poller
        probes:
          readiness:
            spec:
              initialDelaySeconds: 0
              failureThreshold: 3
              timeoutSeconds: 1
              periodSeconds: 10
            custom: false
            type: TCP
            enabled: true
          liveness:
            spec:
              initialDelaySeconds: 0
              failureThreshold: 3
              timeoutSeconds: 1
              periodSeconds: 10
            custom: false
            type: TCP
            enabled: true
          startup:
            spec:
              initialDelaySeconds: 0
              failureThreshold: 30
              timeoutSeconds: 1
              periodSeconds: 5
            custom: false
            type: TCP
            enabled: true
        resources:
          requests:
            cpu: 10m
        image:
          repository: ghcr.io/unpoller/unpoller
          tag: v5.2.4
          pullPolicy: IfNotPresent
    enabled: true
service:
  main:
    ports:
      http:
        enabled: false
      metrics:
        protocol: TCP
        primary: true
        enabled: true
        port: 9130
    primary: true
    type: ClusterIP
    controller: main
    annotations:
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/port: "9130"
serviceMonitor:
  main:
    endpoints:
    - scrapeTimeout: 30s
      interval: 1m
      port: metrics
      path: /metrics
      scheme: http
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    enabled: false
influxdb:
  architecture: standalone
  database: unifi
  persistence:
    enabled: false
  authEnabled: false
  enabled: false

