service:
  main:
    controller: main
    annotations:
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scrape: "true"
    ports:
      http:
        enabled: false
      metrics:
        port: 9130
        protocol: TCP
        primary: true
        enabled: true
    primary: true
    type: ClusterIP
ingress:
  main:
    enabled: false
controllers:
  main:
    replicas: 1
    enabled: true
    containers:
      main:
        env:
          UP_UNIFI_DEFAULT_URL: https://unifi
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
        image:
          repository: ghcr.io/unpoller/unpoller
          pullPolicy: IfNotPresent
          tag: v5.9.6
        probes:
          startup:
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 5
              failureThreshold: 30
            custom: false
            enabled: true
          liveness:
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              failureThreshold: 3
            custom: false
            enabled: true
          readiness:
            type: TCP
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              failureThreshold: 3
            custom: false
            enabled: true
        envFrom:
        - secretRef:
            name: unifi-poller
        resources:
          requests:
            cpu: 10m
    strategy: Recreate
    type: deployment
    revisionHistoryLimit: 3
serviceMonitor:
  main:
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    endpoints:
    - path: /metrics
      scrapeTimeout: 30s
      interval: 1m
      scheme: http
      port: metrics
    enabled: false
influxdb:
  authEnabled: false
  architecture: standalone
  database: unifi
  persistence:
    enabled: false
  enabled: false

