influxdb:
  architecture: standalone
  authEnabled: false
  database: unifi
  enabled: false
  persistence:
    enabled: false
ingress:
  main:
    enabled: false
service:
  main:
    primary: true
    type: ClusterIP
    ports:
      metrics:
        enabled: true
        primary: true
        port: 9130
        protocol: TCP
      http:
        enabled: false
    controller: main
    annotations:
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/scrape: "true"
controllers:
  main:
    type: deployment
    replicas: 1
    enabled: true
    containers:
      main:
        envFrom:
        - secretRef:
            name: unifi-poller
        env:
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
        resources:
          requests:
            cpu: 10m
        image:
          pullPolicy: IfNotPresent
          repository: ghcr.io/unpoller/unpoller
          tag: v5.9.5
        probes:
          liveness:
            custom: false
            spec:
              failureThreshold: 3
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
            enabled: true
            type: TCP
          startup:
            custom: false
            spec:
              failureThreshold: 30
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 1
            enabled: true
            type: TCP
          readiness:
            custom: false
            spec:
              failureThreshold: 3
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
            enabled: true
            type: TCP
    revisionHistoryLimit: 3
    strategy: Recreate
serviceMonitor:
  main:
    enabled: false
    endpoints:
    - path: /metrics
      scrapeTimeout: 30s
      interval: 1m
      port: metrics
      scheme: http
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'

