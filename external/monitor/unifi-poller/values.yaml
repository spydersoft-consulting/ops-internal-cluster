influxdb:
  enabled: false
  database: unifi
  authEnabled: false
  persistence:
    enabled: false
  architecture: standalone
ingress:
  main:
    enabled: false
controllers:
  main:
    enabled: true
    revisionHistoryLimit: 3
    replicas: 1
    containers:
      main:
        resources:
          requests:
            cpu: 10m
        envFrom:
        - secretRef:
            name: unifi-poller
        probes:
          readiness:
            spec:
              timeoutSeconds: 1
              periodSeconds: 10
              initialDelaySeconds: 0
              failureThreshold: 3
            custom: false
            enabled: true
            type: TCP
          startup:
            spec:
              timeoutSeconds: 1
              periodSeconds: 5
              initialDelaySeconds: 0
              failureThreshold: 30
            custom: false
            enabled: true
            type: TCP
          liveness:
            spec:
              timeoutSeconds: 1
              periodSeconds: 10
              initialDelaySeconds: 0
              failureThreshold: 3
            custom: false
            enabled: true
            type: TCP
        image:
          repository: ghcr.io/unpoller/unpoller
          pullPolicy: IfNotPresent
          tag: v5.9.3
        env:
          UP_UNIFI_DEFAULT_URL: https://unifi
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
    type: deployment
    strategy: Recreate
service:
  main:
    ports:
      metrics:
        enabled: true
        primary: true
        protocol: TCP
        port: 9130
      http:
        enabled: false
    annotations:
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/path: /metrics
    type: ClusterIP
    primary: true
    controller: main
serviceMonitor:
  main:
    endpoints:
    - port: metrics
      interval: 1m
      scheme: http
      path: /metrics
      scrapeTimeout: 30s
    enabled: false
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'

