controllers:
  main:
    replicas: 1
    type: deployment
    revisionHistoryLimit: 3
    enabled: true
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/unpoller/unpoller
          pullPolicy: IfNotPresent
          tag: v5.10.2
        envFrom:
        - secretRef:
            name: unifi-poller
        env:
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
        probes:
          liveness:
            enabled: true
            custom: false
            type: TCP
            spec:
              timeoutSeconds: 1
              periodSeconds: 10
              initialDelaySeconds: 0
              failureThreshold: 3
          startup:
            enabled: true
            custom: false
            type: TCP
            spec:
              timeoutSeconds: 1
              periodSeconds: 5
              initialDelaySeconds: 0
              failureThreshold: 30
          readiness:
            enabled: true
            custom: false
            type: TCP
            spec:
              timeoutSeconds: 1
              periodSeconds: 10
              initialDelaySeconds: 0
              failureThreshold: 3
        resources:
          requests:
            cpu: 10m
serviceMonitor:
  main:
    enabled: false
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    endpoints:
    - interval: 1m
      scrapeTimeout: 30s
      port: metrics
      path: /metrics
      scheme: http
ingress:
  main:
    enabled: false
influxdb:
  persistence:
    enabled: false
  authEnabled: false
  architecture: standalone
  enabled: false
  database: unifi
service:
  main:
    controller: main
    type: ClusterIP
    annotations:
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scrape: "true"
    ports:
      metrics:
        protocol: TCP
        enabled: true
        primary: true
        port: 9130
      http:
        enabled: false
    primary: true

