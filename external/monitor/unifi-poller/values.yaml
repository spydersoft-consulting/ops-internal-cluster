influxdb:
  persistence:
    enabled: false
  authEnabled: false
  enabled: false
  database: unifi
  architecture: standalone
ingress:
  main:
    enabled: false
service:
  main:
    primary: true
    controller: main
    annotations:
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/port: "9130"
    ports:
      http:
        enabled: false
      metrics:
        primary: true
        port: 9130
        protocol: TCP
        enabled: true
    type: ClusterIP
serviceMonitor:
  main:
    endpoints:
    - interval: 1m
      scrapeTimeout: 30s
      path: /metrics
      port: metrics
      scheme: http
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    enabled: false
controllers:
  main:
    replicas: 1
    strategy: Recreate
    enabled: true
    revisionHistoryLimit: 3
    containers:
      main:
        env:
          UP_INFLUXDB_DISABLE: true
          TZ: America/New_York
          UP_UNIFI_DEFAULT_URL: https://unifi
        envFrom:
        - secretRef:
            name: unifi-poller
        probes:
          liveness:
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              failureThreshold: 3
            enabled: true
            type: TCP
            custom: false
          readiness:
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              failureThreshold: 3
            enabled: true
            type: TCP
            custom: false
          startup:
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 5
              failureThreshold: 30
            enabled: true
            type: TCP
            custom: false
        resources:
          requests:
            cpu: 10m
        image:
          tag: v3.4.1
          pullPolicy: IfNotPresent
          repository: ghcr.io/unpoller/unpoller
    type: deployment

