ingress:
  main:
    enabled: false
controllers:
  main:
    revisionHistoryLimit: 3
    containers:
      main:
        envFrom:
        - secretRef:
            name: unifi-poller
        resources:
          requests:
            cpu: 10m
        probes:
          liveness:
            custom: false
            spec:
              timeoutSeconds: 1
              failureThreshold: 3
              initialDelaySeconds: 0
              periodSeconds: 10
            enabled: true
            type: TCP
          startup:
            custom: false
            spec:
              timeoutSeconds: 1
              failureThreshold: 30
              initialDelaySeconds: 0
              periodSeconds: 5
            enabled: true
            type: TCP
          readiness:
            custom: false
            spec:
              timeoutSeconds: 1
              failureThreshold: 3
              initialDelaySeconds: 0
              periodSeconds: 10
            enabled: true
            type: TCP
        image:
          tag: v5.10.0
          repository: ghcr.io/unpoller/unpoller
          pullPolicy: IfNotPresent
        env:
          UP_INFLUXDB_DISABLE: true
          UP_UNIFI_DEFAULT_URL: https://unifi
          TZ: America/New_York
    enabled: true
    replicas: 1
    strategy: Recreate
    type: deployment
service:
  main:
    type: ClusterIP
    controller: main
    annotations:
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/scrape: "true"
    ports:
      metrics:
        enabled: true
        primary: true
        port: 9130
        protocol: TCP
      http:
        enabled: false
    primary: true
serviceMonitor:
  main:
    enabled: false
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    endpoints:
    - interval: 1m
      scrapeTimeout: 30s
      port: metrics
      path: /metrics
      scheme: http
influxdb:
  architecture: standalone
  authEnabled: false
  database: unifi
  enabled: false
  persistence:
    enabled: false

