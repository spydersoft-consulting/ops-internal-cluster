service:
  main:
    ports:
      metrics:
        enabled: true
        port: 9130
        primary: true
        protocol: TCP
      http:
        enabled: false
    type: ClusterIP
    annotations:
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scrape: "true"
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/path: /metrics
    primary: true
    controller: main
serviceMonitor:
  main:
    enabled: false
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      scrapeTimeout: 30s
      interval: 1m
controllers:
  main:
    enabled: true
    strategy: Recreate
    containers:
      main:
        probes:
          startup:
            enabled: true
            custom: false
            type: TCP
            spec:
              failureThreshold: 30
              timeoutSeconds: 1
              periodSeconds: 5
              initialDelaySeconds: 0
          liveness:
            enabled: true
            custom: false
            type: TCP
            spec:
              failureThreshold: 3
              timeoutSeconds: 1
              periodSeconds: 10
              initialDelaySeconds: 0
          readiness:
            enabled: true
            custom: false
            type: TCP
            spec:
              failureThreshold: 3
              timeoutSeconds: 1
              periodSeconds: 10
              initialDelaySeconds: 0
        image:
          pullPolicy: IfNotPresent
          tag: v5.5.1
          repository: ghcr.io/unpoller/unpoller
        resources:
          requests:
            cpu: 10m
        envFrom:
        - secretRef:
            name: unifi-poller
        env:
          TZ: America/New_York
          UP_INFLUXDB_DISABLE: true
          UP_UNIFI_DEFAULT_URL: https://unifi
    type: deployment
    replicas: 1
    revisionHistoryLimit: 3
influxdb:
  architecture: standalone
  enabled: false
  authEnabled: false
  persistence:
    enabled: false
  database: unifi
ingress:
  main:
    enabled: false

