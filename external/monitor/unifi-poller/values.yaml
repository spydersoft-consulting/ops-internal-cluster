influxdb:
  enabled: false
  authEnabled: false
  persistence:
    enabled: false
  architecture: standalone
  database: unifi
serviceMonitor:
  main:
    endpoints:
    - port: metrics
      path: /metrics
      interval: 1m
      scheme: http
      scrapeTimeout: 30s
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    enabled: false
ingress:
  main:
    enabled: false
controllers:
  main:
    enabled: true
    revisionHistoryLimit: 3
    containers:
      main:
        image:
          pullPolicy: IfNotPresent
          repository: ghcr.io/unpoller/unpoller
          tag: v5.2.7
        env:
          TZ: America/New_York
          UP_INFLUXDB_DISABLE: true
          UP_UNIFI_DEFAULT_URL: https://unifi
        resources:
          requests:
            cpu: 10m
        probes:
          liveness:
            custom: false
            type: TCP
            spec:
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 1
              initialDelaySeconds: 0
            enabled: true
          readiness:
            custom: false
            type: TCP
            spec:
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 1
              initialDelaySeconds: 0
            enabled: true
          startup:
            custom: false
            type: TCP
            spec:
              failureThreshold: 30
              periodSeconds: 5
              timeoutSeconds: 1
              initialDelaySeconds: 0
            enabled: true
        envFrom:
        - secretRef:
            name: unifi-poller
    strategy: Recreate
    replicas: 1
    type: deployment
service:
  main:
    controller: main
    ports:
      metrics:
        port: 9130
        primary: true
        protocol: TCP
        enabled: true
      http:
        enabled: false
    annotations:
      metrics.spydersoft.io/port: "9130"
      metrics.spydersoft.io/scheme: http
      metrics.spydersoft.io/path: /metrics
      metrics.spydersoft.io/scrape: "true"
    primary: true
    type: ClusterIP

