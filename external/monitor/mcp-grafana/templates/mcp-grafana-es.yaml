apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-secret-es

spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-grafana-secret
  data:
  - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
    remoteRef:
      key: secrets-k8/monitoring/mcp-grafana
      property: grafana_service_account_token
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: MCP_GRAFANA_SERVER_TOKEN
    remoteRef:
      key: secrets-k8/monitoring/mcp-grafana
      property: server_token
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
